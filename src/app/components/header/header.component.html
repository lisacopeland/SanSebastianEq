<header class="bg-gray-800 text-white shadow-md">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="text-xl font-bold"><a routerLink="/">San Sebastian Equestrian Center</a></div>

    <!-- Hamburger icon for mobile -->
    <button (click)="toggleMenu()" class="md:hidden focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round"
        stroke-linejoin="round">
        <path [attr.d]="isMenuOpen
          ? 'M6 18L18 6M6 6l12 12'
          : 'M4 6h16M4 12h16M4 18h16'" />
      </svg>
    </button>

    <!-- Nav Links (Desktop) -->
    <nav class="hidden md:flex space-x-6">
      <a routerLink="/" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Home</a>
      <a routerLink="/services" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white`' : 'text-yellow-400'" class="hover:text-yellow-400">Services</a>
      <a routerLink="/gallery" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Gallery</a>
      <a routerLink="/contact" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Contact</a>
    </nav>
  </div>

  <!-- Mobile Menu -->
  <div class="md:hidden px-4 pb-4" *ngIf="isMenuOpen">
    <nav class="flex flex-col space-y-2">
      <a routerLink="/" (click)="closeMenu()" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Home</a>
      <a routerLink="/services" (click)="closeMenu()" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Services</a>
      <a routerLink="/gallery" (click)="closeMenu()" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Gallery</a>
      <a routerLink="/contact" (click)="closeMenu()" #rlaSvc="routerLinkActive" routerLinkActive="is-active"
        [ngClass]="rlaSvc.isActive ? 'text-white' : 'text-yellow-400'" class="hover:text-yellow-400">Contact</a>
    </nav>
  </div>
</header>
